{
  "apiVersion": "mysql.oracle.com/v2",
  "kind": "InnoDBCluster",
  "metadata": {
    "name": "cluster2",
    "namespace": "mysql-cluster2"
  },
  "spec": {
    "secretName": "cluster2-root",
    "instances": 1,
    "baseServerId": 2000,
    "version": "26.10.0",
    "tlsUseSelfSigned": true,
    "serviceFqdnTemplate": "frankfurt.{service}.{namespace}.svc.clusterset.local",
    "datadirPermissions": {
      "setRightsUsingInitContainer": false
    },
    "podSpec": {
      "nodeSelector": {
        "workload": "mysql-cluster"
      },
      "affinity": {
        "nodeAffinity": {
          "requiredDuringSchedulingIgnoredDuringExecution": {
            "nodeSelectorTerms": [
              {
                "matchExpressions": [
                  {
                    "key": "node-role.kubernetes.io/worker",
                    "operator": "Exists"
                  },
                  {
                    "key": "node-role.kubernetes.io/control-plane",
                    "operator": "DoesNotExist"
                  },
                  {
                    "key": "node-role.kubernetes.io/master",
                    "operator": "DoesNotExist"
                  }
                ]
              }
            ]
          }
        }
      },
      "securityContext": {
        "runAsNonRoot": true,
        "runAsUser": 27,
        "runAsGroup": 27,
        "fsGroup": 27
      }
    },
    "router": {
      "instances": 1,
      "podSpec": {
        "nodeSelector": {
          "workload": "mysql-cluster"
        },
        "affinity": {
          "nodeAffinity": {
            "requiredDuringSchedulingIgnoredDuringExecution": {
              "nodeSelectorTerms": [
                {
                  "matchExpressions": [
                    {
                      "key": "node-role.kubernetes.io/worker",
                      "operator": "Exists"
                    },
                    {
                      "key": "node-role.kubernetes.io/control-plane",
                      "operator": "DoesNotExist"
                    },
                    {
                      "key": "node-role.kubernetes.io/master",
                      "operator": "DoesNotExist"
                    }
                  ]
                }
              ]
            }
          }
        },
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 999,
          "runAsGroup": 999
        }
      }
    },
    "datadirVolumeClaimTemplate": {
      "accessModes": [
        "ReadWriteOnce"
      ],
      "storageClassName": "mysql-oci-bv",
      "resources": {
        "requests": {
          "storage": "50Gi"
        }
      }
    },
    "initDB": {
      "clusterSet": {
        "targetUrl": "cluster1-0.london.cluster1-instances.mysql-cluster1.svc.clusterset.local:3306",
        "rootUser": "root",
        "secretKeyRef": {
          "name": "cluster2-root"
        }
      }
    }
  }
}
